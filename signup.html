<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — Harmonia</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-container { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .auth-logo { font-family:"Cormorant Garamond",serif; font-size:1.6rem; color:white; opacity:.8; margin-bottom:24px; text-align:center; }
    .auth-card { width:90%; max-width:400px; }
    .auth-card h1 { font-size:1.8rem; margin-bottom:8px; }
    .price-badge { display:inline-block; background:rgba(157,122,67,.25); border:1px solid rgba(157,122,67,.5); color:#f3d08a; padding:6px 16px; border-radius:999px; font-size:.82em; margin-bottom:20px; }
    .features-list { list-style:none; padding:0; margin-bottom:20px; }
    .features-list li { font-size:.85em; opacity:.7; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
    .features-list li::before { content:"✓"; color:#52b788; font-weight:700; }
  </style>
</head>
<body class="auth-page">

<div class="auth-container">
  <div>
      <div class="auth-logo"><img src="logo-harmonia-gold.png" alt="Harmonia logo"> Harmonia</div>   
    <div class="auth-card">
      <h1>Commencer</h1>
      <p>Crée ton compte et accède à Harmonia Premium</p>

      <div class="price-badge">14,90€ / mois · Sans engagement</div>

      <ul class="features-list">
        <li>Méditation, respiration, mobilité illimités</li>
        <li>Journal de bien-être personnel</li>
        <li>Suivi de progression et statistiques</li>
        <li>Connexion sécurisée sans mot de passe</li>
      </ul>

      <!-- Flux A: l'abonnement se fait directement via Stripe Checkout, qui collecte
           email, prenom, nom, adresse et telephone de maniere securisee. -->
      <label class="cgu-label" style="display:flex;align-items:flex-start;gap:8px;margin:8px 0 16px;font-size:.85rem;text-align:left;">
        <input type="checkbox" id="cguCheck" style="margin-top:3px;">
        <span>J'accepte les <a href="mentions-legales.html">mentions legales</a> et les conditions d'utilisation.</span>
      </label>

      <button type="button" id="subscribeBtn" class="btn-primary">S'abonner — 14,90€/mois →</button>

      <p id="subError" style="color:#e11d48;font-size:.85rem;margin-top:10px;display:none;"></p>

      <div class="auth-links">
        <p>Déjà un compte ?</p>
        <a href="login.html">Se connecter</a>
      </div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
(function () {
  // Flux A: clic sur "S'abonner" -> creation de la session Stripe Checkout -> redirection
  var PRICE_ID = "price_1TUn0AF9c1lWA0HyP8ZwVeBN";
  var btn = document.getElementById("subscribeBtn");
  var cgu = document.getElementById("cguCheck");
  var errEl = document.getElementById("subError");

  function showErr(msg) {
    if (errEl) { errEl.textContent = msg; errEl.style.display = "block"; }
  }

  btn.addEventListener("click", async function () {
    if (errEl) errEl.style.display = "none";
    if (cgu && !cgu.checked) {
      showErr("Veuillez accepter les mentions legales pour continuer.");
      return;
    }
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = "Redirection\u2026";
    try {
      var r = await fetch("/api/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ priceId: PRICE_ID })
      });
      var data = await r.json();
      if (data && data.url) {
        window.location.href = data.url;
      } else {
        showErr("Erreur : " + ((data && data.error) || "impossible de demarrer le paiement."));
        btn.disabled = false;
        btn.textContent = original;
      }
    } catch (e) {
      showErr("Erreur de connexion. Veuillez reessayer.");
      btn.disabled = false;
      btn.textContent = original;
    }
  });
})();
</script>
</body>
</html>
