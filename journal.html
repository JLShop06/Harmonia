<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal – Harmonia</title>
<link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="luxe.css">
<style>
.journal-page{max-width:800px;margin:0 auto;padding:20px}
.journal-header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.journal-header h1{font-size:1.8rem;color:#2d6a4f;margin:0}
.date-picker-wrap{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.date-picker-wrap label{font-weight:600;color:#2d6a4f}
.date-input{padding:8px 14px;border:2px solid #b7e4c7;border-radius:8px;font-size:.95rem;color:#2d3436;cursor:pointer}
.date-input:focus{outline:none;border-color:#52b788}
.mood-selector{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.mood-btn{font-size:1.8rem;background:none;border:2px solid transparent;border-radius:50%;width:52px;height:52px;cursor:pointer;transition:all .2s;line-height:1}
.mood-btn:hover,.mood-btn.active{border-color:#52b788;background:#d8f3dc;transform:scale(1.15)}
.mood-label{font-size:.75rem;color:#666;text-align:center;display:block}
.mood-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.journal-editor-wrap{position:relative;margin-bottom:20px}
.journal-textarea{width:100%;min-height:180px;padding:16px;border:2px solid #b7e4c7;border-radius:12px;font-size:1rem;line-height:1.6;resize:vertical;font-family:inherit;color:#2d3436;background:#fff;transition:border-color .2s;box-sizing:border-box}
.journal-textarea:focus{outline:none;border-color:#52b788;box-shadow:0 0 0 3px rgba(82,183,136,.15)}
.char-count{position:absolute;bottom:10px;right:14px;font-size:.75rem;color:#aaa}
.save-btn{background:linear-gradient(135deg,#52b788,#2d6a4f);color:#fff;border:none;padding:12px 32px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
.save-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(82,183,136,.4)}
.save-btn:disabled{opacity:.6;cursor:not-allowed}
.save-status{margin-left:14px;font-size:.9rem;font-weight:600;color:#52b788}
.entries-section{margin-top:40px}
.entries-section h2{font-size:1.3rem;color:#2d6a4f;margin-bottom:16px}
.search-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.search-input{flex:1;padding:10px 14px;border:2px solid #b7e4c7;border-radius:8px;font-size:.92rem;color:#2d3436;transition:border-color .2s}
.search-input:focus{outline:none;border-color:#52b788;box-shadow:0 0 0 3px rgba(82,183,136,.15)}
.search-clear{background:none;border:none;color:#888;cursor:pointer;font-size:1.2rem;padding:4px 8px}
.search-clear:hover{color:#e74c3c}
.search-count{font-size:.8rem;color:#888;white-space:nowrap}
.entry-card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:4px solid #52b788}
.entry-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.entry-date{font-size:.85rem;color:#888;font-weight:600}
.entry-mood{font-size:1.4rem}
.entry-content{color:#444;line-height:1.6;white-space:pre-wrap;font-size:.95rem}
.entry-actions{margin-top:12px;display:flex;gap:10px}
.entry-edit-btn{background:none;border:1px solid #52b788;color:#52b788;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:.8rem;transition:all .2s}
.entry-edit-btn:hover{background:#52b788;color:#fff}
.entry-del-btn{background:none;border:1px solid #ff6b6b;color:#ff6b6b;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:.8rem;transition:all .2s}
.entry-del-btn:hover{background:#ff6b6b;color:#fff}
.empty-journal{text-align:center;padding:40px;color:#aaa}
.empty-journal .icon{font-size:3rem;display:block;margin-bottom:12px}
.toast{position:fixed;bottom:24px;right:24px;background:#52b788;color:#fff;padding:12px 24px;border-radius:10px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:9999;opacity:0;transform:translateY(20px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
mark{background:#d8f3dc;padding:0 2px;border-radius:2px}
@media(max-width:600px){.journal-page{padding:12px}.mood-btn{width:44px;height:44px;font-size:1.5rem}}
</style>
</head>
<body class="dash-page">
<div class="harmonia-bg"></div>
<nav class="navbar">
<div class="nav-brand">🌿 Harmonia</div>
<div class="nav-links">
<a href="dashboard.html">Tableau de bord</a>
    <a href="rituel.html">Rituel</a>
<a href="journal.html" class="active">Journal</a>
<a href="progress.html">Progrès</a>
<a href="account.html">Mon compte</a>
</div>
<div style="display:flex;align-items:center;gap:8px;">
<button class="nav-logout" id="logoutBtn">Se déconnecter</button>
<button class="nav-hamburger" id="hamburgerBtn" aria-label="Menu">☰</button>
</div>
</nav>
<div class="nav-mobile-menu" id="mobileMenu">
<div class="nav-mobile-panel">
<button class="nav-mobile-close" id="closeMenuBtn">✕</button>
<a href="dashboard.html">Tableau de bord</a>
<a href="journal.html" class="active">Journal</a>
<a href="progress.html">Progrès</a>
<a href="account.html">Mon compte</a>
<button class="nav-logout" id="logoutBtnMobile" style="margin-top:16px;width:100%;border-radius:10px;">Se déconnecter</button>
</div>
</div>
<main class="journal-page">
<div class="journal-header">
<span style="font-size:2rem">📓</span>
<h1>Mon Journal de Bien-être</h1>
</div>
<div class="date-picker-wrap">
<label for="entryDate">Date :</label>
<input type="date" id="entryDate" class="date-input">
</div>
<div class="mood-selector" id="moodSelector">
<div class="mood-item"><button class="mood-btn" data-mood="1" title="Très difficile">😔</button><span class="mood-label">Difficile</span></div>
<div class="mood-item"><button class="mood-btn" data-mood="2" title="Pas terrible">😐</button><span class="mood-label">Moyen</span></div>
<div class="mood-item"><button class="mood-btn" data-mood="3" title="Correct">🙂</button><span class="mood-label">Correct</span></div>
<div class="mood-item"><button class="mood-btn" data-mood="4" title="Bien">😊</button><span class="mood-label">Bien</span></div>
<div class="mood-item"><button class="mood-btn" data-mood="5" title="Excellent">😄</button><span class="mood-label">Excellent</span></div>
</div>
<div class="journal-editor-wrap">
<textarea class="journal-textarea" id="journalText" placeholder="Comment vous sentez-vous aujourd'hui ? Notez vos pensées, vos ressentis, vos progrès..." maxlength="2000"></textarea>
<span class="char-count" id="charCount">0 / 2000</span>
</div>
<div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:32px;">
<button class="save-btn" id="saveBtn" disabled>💾 Enregistrer l'entrée</button>
<span class="save-status" id="saveStatus"></span>
</div>
<section class="entries-section">
<h2>📚 Mes dernières entrées</h2>
<div class="search-wrap">
<input type="search" class="search-input" id="journalSearch" placeholder="🔍 Rechercher dans mes entrées...">
<button class="search-clear" id="clearSearchBtn" style="display:none">×</button>
<span class="search-count" id="searchCount"></span>
</div>
<div id="entriesList"><div class="empty-journal"><span class="icon">✏️</span><p>Votre journal est vide. Commencez à écrire ci-dessus !</p></div></div>
</section>
</main>
<div class="toast" id="toast"></div>
<script src="auth.js"></script>
<script>
const MOOD_EMOJIS=['','😔','😐','🙂','😊','😄'];
let currentUser=null,selectedMood=null,autoSaveTimer=null,allEntries=[];
function today(){return new Date().toISOString().split('T')[0];}
function formatDate(d){const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function showToast(msg,ok){const t=document.getElementById('toast');t.textContent=msg;t.style.background=(ok===false)?'#e74c3c':'#52b788';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

async function initAuth(){
  const sb=window._supabase;
  if(!sb){window.location.href='login.html';return;}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return;}
  currentUser=session.user;
  document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();window.location.href='login.html';});
  document.getElementById('logoutBtnMobile')?.addEventListener('click',async()=>{await sb.auth.signOut();window.location.href='login.html';});
  document.getElementById('hamburgerBtn')?.addEventListener('click',()=>document.getElementById('mobileMenu').classList.add('open'));
  document.getElementById('closeMenuBtn')?.addEventListener('click',()=>document.getElementById('mobileMenu').classList.remove('open'));
  document.getElementById('mobileMenu')?.addEventListener('click',e=>{if(e.target===document.getElementById('mobileMenu'))document.getElementById('mobileMenu').classList.remove('open');});
  setupForm();setupSearch();loadEntries();
}

function setupForm(){
  const di=document.getElementById('entryDate');
  di.value=today();di.max=today();
  const ta=document.getElementById('journalText');
  const cc=document.getElementById('charCount');
  const sb2=document.getElementById('saveBtn');
  const draft=localStorage.getItem('harmonia_journal_draft_'+today());
  if(draft){ta.value=draft;cc.textContent=draft.length+' / 2000';if(draft.length>=3)sb2.disabled=false;}
  di.addEventListener('change',()=>loadEntryForDate(di.value));
  ta.addEventListener('input',()=>{
    const len=ta.value.length;
    cc.textContent=len+' / 2000';
    sb2.disabled=len<3;
    if(di.value===today())localStorage.setItem('harmonia_journal_draft_'+today(),ta.value);
    clearTimeout(autoSaveTimer);
    if(len>=10){autoSaveTimer=setTimeout(()=>{
      document.getElementById('saveStatus').textContent='💾 Sauvegarde auto...';
      saveEntry(true).then(()=>{
        document.getElementById('saveStatus').textContent='✅ Sauvegardé';
        setTimeout(()=>{document.getElementById('saveStatus').textContent='';},2000);
      });
    },3000);}
  });
  document.getElementById('moodSelector').addEventListener('click',e=>{
    const btn=e.target.closest('.mood-btn');if(!btn)return;
    document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');selectedMood=parseInt(btn.dataset.mood);
  });
  document.getElementById('saveBtn').addEventListener('click',()=>saveEntry(false));
}

function setupSearch(){
  const si=document.getElementById('journalSearch');
  const cb=document.getElementById('clearSearchBtn');
  si.addEventListener('input',function(){const q=this.value.trim().toLowerCase();cb.style.display=q?'block':'none';renderEntries(q);});
  cb.addEventListener('click',function(){si.value='';this.style.display='none';renderEntries('');});
}

function renderEntries(query){
  const list=document.getElementById('entriesList');
  const cEl=document.getElementById('searchCount');
  const filtered=query?allEntries.filter(e=>(e.content||'').toLowerCase().includes(query)):allEntries;
  cEl.textContent=query?(filtered.length+' résultat(s)'):'';
  if(!filtered.length){
    list.innerHTML='<div class="empty-journal"><span class="icon">✏️</span><p>'+(query?'Aucun résultat.':'Votre journal est vide.')+'</p></div>';
    return;
  }
  list.innerHTML=filtered.map(function(e){
    var mE=e.mood?MOOD_EMOJIS[e.mood]:'';
    var prev=e.content.length>200?e.content.slice(0,200)+'…':e.content;
    var esc=prev.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(query){var re=new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');esc=esc.replace(re,function(m){return '<mark>'+m+'</mark>';});}
    return '<div class="entry-card"><div class="entry-card-header"><span class="entry-date">📅 '+formatDate(e.entry_date)+'</span><span class="entry-mood">'+mE+'</span></div><div class="entry-content">'+esc+'</div><div class="entry-actions"><button class="entry-edit-btn" onclick="editEntry(\''+e.id+'\',\''+e.entry_date+'\')">✏️ Modifier</button><button class="entry-del-btn" onclick="deleteEntry(\''+e.id+'\')">🗑 Supprimer</button></div></div>';
  }).join('');
}

async function loadEntryForDate(dateStr){
  const sb=window._supabase;
  const ta=document.getElementById('journalText');
  const cc=document.getElementById('charCount');
  const sb2=document.getElementById('saveBtn');
  if(dateStr===today()){const d=localStorage.getItem('harmonia_journal_draft_'+today())||'';ta.value=d;cc.textContent=d.length+' / 2000';sb2.disabled=d.length<3;}
  const {data}=await sb.from('journal_entries').select('*').eq('user_id',currentUser.id).eq('entry_date',dateStr).maybeSingle();
  if(data){
    ta.value=data.content||'';cc.textContent=(data.content||'').length+' / 2000';sb2.disabled=(data.content||'').length<3;
    document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('active'));
    if(data.mood){const mb=document.querySelector('.mood-btn[data-mood="'+data.mood+'"]');if(mb)mb.classList.add('active');selectedMood=data.mood;}else selectedMood=null;
  }else if(dateStr!==today()){ta.value='';cc.textContent='0 / 2000';sb2.disabled=true;document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('active'));selectedMood=null;}
}

async function saveEntry(silent){
  const sb=window._supabase;
  const content=document.getElementById('journalText').value.trim();
  const entryDate=document.getElementById('entryDate').value;
  const sb2=document.getElementById('saveBtn');
  const ss=document.getElementById('saveStatus');
  if(content.length<3)return;
  if(!silent){sb2.disabled=true;ss.textContent='Enregistrement...';}
  const {data:existing}=await sb.from('journal_entries').select('id').eq('user_id',currentUser.id).eq('entry_date',entryDate).maybeSingle();
  let error;
  if(existing){({error}=await sb.from('journal_entries').update({content,mood:selectedMood,updated_at:new Date().toISOString()}).eq('id',existing.id));}
  else{({error}=await sb.from('journal_entries').insert({user_id:currentUser.id,entry_date:entryDate,content,mood:selectedMood}));}
  if(error){ss.textContent='';showToast('Erreur: '+error.message,false);if(!silent)sb2.disabled=false;return;}
  if(!silent){
    ss.textContent=existing?'✅ Mis à jour !':'✅ Enregistré !';
    showToast(existing?'Entrée mise à jour !':'Entrée enregistrée !');
    setTimeout(()=>{ss.textContent='';},3000);
    localStorage.removeItem('harmonia_journal_draft_'+today());
    document.getElementById('journalText').value='';
    document.getElementById('charCount').textContent='0 / 2000';
    document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('active'));
    selectedMood=null;sb2.disabled=true;loadEntries();
  }
}

async function loadEntries(){
  const sb=window._supabase;
  const {data:entries}=await sb.from('journal_entries').select('*').eq('user_id',currentUser.id).order('entry_date',{ascending:false}).limit(30);
  allEntries=entries||[];
  renderEntries(document.getElementById('journalSearch')?.value.trim().toLowerCase()||'');
}

async function editEntry(id,dateStr){
  document.getElementById('entryDate').value=dateStr;
  await loadEntryForDate(dateStr);
  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteEntry(id){
  if(!confirm('Supprimer cette entrée ?'))return;
  const {error}=await window._supabase.from('journal_entries').delete().eq('id',id);
  if(!error){showToast('Entrée supprimée');allEntries=allEntries.filter(e=>e.id!==id);renderEntries(document.getElementById('journalSearch')?.value.trim().toLowerCase()||'');}
  else showToast('Erreur suppression',false);
}
window.deleteEntry=deleteEntry;window.editEntry=editEntry;

document.addEventListener('DOMContentLoaded',()=>{
  const chk=setInterval(()=>{if(window._supabase){clearInterval(chk);initAuth();}},100);
  setTimeout(()=>clearInterval(chk),5000);
});
</script>
</body>
</html>
