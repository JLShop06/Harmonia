<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Harmonia</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-container { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .auth-logo { font-family:"Cormorant Garamond",serif; font-size:1.6rem; color:white; opacity:.8; margin-bottom:24px; text-align:center; }
    .auth-card { width:90%; max-width:380px; }
    .auth-card h1 { font-size:1.8rem; margin-bottom:8px; }
    .magic-info { background:rgba(255,255,255,.08); border-radius:10px; padding:12px 16px; margin-bottom:20px; font-size:.85em; opacity:.75; display:flex; align-items:center; gap:10px; }
    .check-redirect { margin-top:16px; font-size:.82em; opacity:.6; text-align:center; }
  </style>
</head>
<body class="auth-page">

<div class="auth-container">
  <div>
    <div class="auth-logo">🌿 Harmonia</div>
    <div class="auth-card">
      <h1>Connexion</h1>
      <p>Reçois un lien magique par email, sans mot de passe.</p>

      <div class="magic-info">
        🔒 Connexion sécurisée sans mot de passe. Un lien unique est envoyé à ton adresse email.
      </div>

      <form id="loginForm">
        <input name="email" type="email" placeholder="Adresse email" required autocomplete="email">
        <button type="submit">Envoyer le lien magique</button>
      </form>

      <div id="loginMsg" style="display:none;text-align:center;padding:16px;"></div>

      <div class="auth-links">
        <p>Pas encore de compte ?</p>
        <a href="signup.html">Créer un compte</a>
      </div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
function waitForSupabase(timeout) {
  return new Promise(function(resolve) {
    if (window._supabase) return resolve(window._supabase);
    var t = setInterval(function() {
      if (window._supabase) { clearInterval(t); resolve(window._supabase); }
    }, 50);
    setTimeout(function() { clearInterval(t); resolve(window._supabase); }, timeout || 5000);
  });
}

var loginForm = document.getElementById("loginForm");
var loginMsg = document.getElementById("loginMsg");

// Si déjà connecté, rediriger
waitForSupabase().then(async function(sb) {
  if (!sb) return;
  var s = await sb.auth.getSession();
  if (s.data.session) window.location.href = "dashboard.html";
});

loginForm.addEventListener("submit", async function(e) {
  e.preventDefault();
  var email = loginForm.email.value.trim();
  var submitBtn = loginForm.querySelector("button[type=submit]");
  submitBtn.disabled = true;
  submitBtn.textContent = "Envoi en cours...";
  
  var sb = await waitForSupabase();
  if (!sb) {
    loginMsg.style.display = "block";
    loginMsg.innerHTML = "<p style='color:#f87171;'>Erreur: service non disponible. Rechargez la page.</p>";
    submitBtn.disabled = false;
    submitBtn.textContent = "Envoyer le lien magique";
    return;
  }
  
  var result = await sb.auth.signInWithOtp({
    email: email,
    options: { emailRedirectTo: "https://harmonia-woad.vercel.app/auth-callback.html" }
  });

  if (result.error) {
    loginMsg.style.display = "block";
    loginMsg.innerHTML = "<p style='color:#f87171;'>Erreur : " + result.error.message + "</p>";
    submitBtn.disabled = false;
    submitBtn.textContent = "Envoyer le lien magique";
    return;
  }

  loginForm.style.display = "none";
  loginMsg.style.display = "block";
  loginMsg.innerHTML = `<div style="font-size:2rem;margin-bottom:12px;">✉️</div>
<p style="font-size:1.05em;margin-bottom:8px;">Lien envoyé à <strong>${email}</strong></p>
<p style="opacity:.7;font-size:.9em;">Clique sur le lien dans l'email pour accéder à ton espace.</p>
<p class="check-redirect">Tu peux fermer cet onglet après avoir cliqué sur le lien.</p>`;
});
</script>

</body>
</html>
