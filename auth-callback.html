<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion en cours — Harmonia</title>
<link rel="stylesheet" href="styles.css">
<style>
.callback-wrapper {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: "Inter", sans-serif;
  text-align: center;
  padding: 20px;
}
.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top-color: #9d7a43;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.callback-wrapper p { opacity: 0.7; margin-top: 8px; font-size: 0.95em; }
.cb-icon { font-size: 3rem; margin-bottom: 16px; display: none; }
</style>
</head>
<body>

<div class="callback-wrapper">
  <div class="spinner" id="spinner"></div>
  <div class="cb-icon" id="cbIcon"></div>
  <h2 id="statusTitle">Connexion en cours…</h2>
  <p id="statusMsg">Merci de patienter</p>
</div>

<script src="auth.js"></script>
<script>
const STRIPE_API = "https://harmonia-woad.vercel.app/api/create-checkout-session";
const PRICE_ID = "price_1TUn0AF9c1lWA0HyP8ZwVeBN";

const titleEl = document.getElementById("statusTitle");
const msgEl = document.getElementById("statusMsg");
const spinner = document.getElementById("spinner");
const cbIcon = document.getElementById("cbIcon");

function showIcon(emoji) {
  spinner.style.display = "none";
  cbIcon.style.display = "block";
  cbIcon.textContent = emoji;
}

async function handleCallback() {
  const waitReady = () => new Promise(resolve => {
    const t = setInterval(() => {
      if (window._supabase) { clearInterval(t); resolve(); }
    }, 50);
    setTimeout(() => { clearInterval(t); resolve(); }, 5000);
  });

  await waitReady();
  const db = window._supabase;

  if (!db) {
    showIcon("❌");
    titleEl.textContent = "Erreur de configuration";
    msgEl.textContent = "Supabase non initialisé.";
    return;
  }

  const { data: { session }, error } = await db.auth.getSession();

  if (error || !session) {
    showIcon("❌");
    titleEl.textContent = "Lien invalide ou expiré";
    msgEl.textContent = "Demande un nouveau lien sur la page de connexion.";
    setTimeout(() => window.location.href = "login.html", 3000);
    return;
  }

  const user = session.user;
  const pendingStripe = localStorage.getItem("signup_pending_stripe") === "true";
  const firstName = localStorage.getItem("signup_first_name") || "";
  const lastName = localStorage.getItem("signup_last_name") || "";
  const email = user.email;

  await db.from("users").upsert([{
    id: user.id,
    email: email,
    first_name: firstName || null,
    last_name: lastName || null
  }], { onConflict: "id" });

  if (pendingStripe) {
    showIcon("✅");
    titleEl.textContent = "Compte créé !";
    msgEl.textContent = "Redirection vers le paiement…";

    localStorage.removeItem("signup_pending_stripe");
    localStorage.removeItem("signup_first_name");
    localStorage.removeItem("signup_last_name");
    localStorage.removeItem("signup_email");

    try {
      const response = await fetch(STRIPE_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ priceId: PRICE_ID, email, firstName, lastName })
      });
      const data = await response.json();
      if (data.url) {
        window.location.href = data.url;
      } else {
        throw new Error(data.error || "URL Stripe manquante");
      }
    } catch (err) {
      showIcon("⚠️");
      titleEl.textContent = "Erreur paiement";
      msgEl.textContent = err.message + " — Redirection vers le dashboard…";
      setTimeout(() => window.location.href = "dashboard.html", 3000);
    }
  } else {
    showIcon("✅");
    titleEl.textContent = "Connecté !";
    msgEl.textContent = "Redirection vers ton espace…";
    setTimeout(() => window.location.href = "dashboard.html", 1000);
  }
}

handleCallback();
</script>

</body>
</html>
